[project]
name = "zeroshot-vdr"
version = "0.1.0"
description = "Zero-Shot Visual Document Retrieval with ColPali"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Member A" },
    { name = "Member B" },
]

dependencies = [
    # Core ML
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    # Transformers & VLMs
    "transformers>=5.3.0,<5.6.0",
    "colpali-engine>=0.3.0",
    "einops>=0.7.0",
    "peft>=0.18.0,<0.19.0",
    # Document processing
    "Pillow>=10.0.0",
    "pypdfium2>=4.0.0",
    # Data & Metrics
    "datasets>=2.18.0",
    "pyyaml>=6.0",
    "numpy>=1.24.0",
    # Utilities
    "tqdm>=4.65.0",
    "rich>=13.0.0",
    # Analysis & notebooks
    "jupyter>=1.0.0",
    "matplotlib>=3.8.0",
    "pandas>=2.0.0",
    "ipywidgets>=8.0.0",
    # Testing
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]


[tool.uv]
# 默认索引保持 PyPI，torch/torchvision 通过 [tool.uv.sources] 走 CUDA 索引
extra-index-url = ["https://mirror.nju.edu.cn/pypi/web/simple"]

[tool.uv.sources]
# 明确指定 PyTorch 来源，防止误装 CPU 版本
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
